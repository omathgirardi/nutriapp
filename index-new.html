<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NutriPlan - Plataforma Completa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      }
    </style>
  </head>
  <body class="min-h-screen">
    <div id="root"></div>

    <script type="module">
      // Import React from CDN
      import React, { useState, useEffect } from 'https://esm.sh/react@18.2.0';
      import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';

      // Hatch client initialization with localStorage-based storage
      const initHatchClient = async (useEffect, useState) => {
        // Try to load stored state from JSON file, fallback to inline data
        let initialStorage = {};
        try {
          const response = await fetch('./public/storedState.json');
          initialStorage = await response.json();
        } catch (error) {
          console.warn('Could not load storedState.json, using inline data:', error);
          // Fallback to inline stored state data for file:// URLs
          initialStorage = {
            "userRole": "admin",
            "currentUser": {
              "id": "admin",
              "name": "Administrador",
              "email": "admin@nutriapp.com"
            },
            "activeSection": "dashboard",
            "profilePhoto": null
          };
        }

        // Initialize localStorage with stored state
        const STORAGE_PREFIX = 'hatch_component_';
        Object.entries(initialStorage).forEach(([key, value]) => {
          const storageKey = STORAGE_PREFIX + key;
          if (!localStorage.getItem(storageKey)) {
            localStorage.setItem(storageKey, JSON.stringify(value));
          }
        });

        // Implement useStoredState hook compatible with Hatch
        const useStoredState = (key, defaultValue) => {
          const storageKey = STORAGE_PREFIX + key;

          // Get initial value from localStorage or use default
          const getStoredValue = () => {
            try {
              const item = localStorage.getItem(storageKey);
              return item ? JSON.parse(item) : defaultValue;
            } catch (error) {
              console.warn('Error reading from localStorage:', error);
              return defaultValue;
            }
          };

          const [value, setValue] = useState(getStoredValue);

          // Update localStorage when value changes
          const setStoredValue = (newValue) => {
            try {
              const valueToStore = typeof newValue === 'function' ? newValue(value) : newValue;
              localStorage.setItem(storageKey, JSON.stringify(valueToStore));
              setValue(valueToStore);
            } catch (error) {
              console.error('Error writing to localStorage:', error);
            }
          };

          // Listen for storage changes from other tabs/windows
          useEffect(() => {
            const handleStorageChange = (e) => {
              if (e.key === storageKey && e.newValue) {
                try {
                  setValue(JSON.parse(e.newValue));
                } catch (error) {
                  console.warn('Error parsing storage change:', error);
                }
              }
            };

            window.addEventListener('storage', handleStorageChange);
            return () => window.removeEventListener('storage', handleStorageChange);
          }, [storageKey]);

          return [value, setStoredValue];
        };

        // Set up global Hatch client interface
        window.hatch = {
          useStoredState,
          // Mock implementations for other Hatch features
          useUser: () => ({ id: 'local', name: 'Local User', color: '#4F46E5' }),
          useCollaborators: () => [],
          useAssets: () => [],
          getAllItems: async () => {
            const items = {};
            for (let i = 0; i < localStorage.length; i++) {
              const key = localStorage.key(i);
              if (key && key.startsWith(STORAGE_PREFIX)) {
                const itemKey = key.replace(STORAGE_PREFIX, '');
                try {
                  items[itemKey] = JSON.parse(localStorage.getItem(key));
                } catch (error) {
                  console.warn('Error parsing stored item:', key, error);
                }
              }
            }
            return items;
          },
          getItem: async (key) => {
            try {
              const item = localStorage.getItem(STORAGE_PREFIX + key);
              return item ? JSON.parse(item) : undefined;
            } catch (error) {
              console.warn('Error getting item:', key, error);
              return undefined;
            }
          },
          setItem: async (key, value) => {
            try {
              localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(value));
            } catch (error) {
              console.error('Error setting item:', key, error);
            }
          }
        };

        // Backward compatibility and global availability
        window.useStoredState = useStoredState;
        window.React = React;
        window.useState = useState;
        window.useEffect = useEffect;
      };

      // Initialize Hatch client
      await initHatchClient(useEffect, useState);

      try {
        // Try to load main component from external file, fallback to dynamic import
        let App;
        try {
          const { default: AppComponent } = await import('./src/App.jsx');
          App = AppComponent;
        } catch (importError) {
          console.warn('Could not load modular components, loading fallback:', importError);
          
          // Fallback: load the original component for compatibility
          try {
            const response = await fetch('./component.js');
            const componentCode = await response.text();
            // Use dynamic evaluation for fallback
            const module = { exports: {} };
            eval(`(function(module, exports) { ${componentCode} })`)(module, module.exports);
            App = module.exports.default || module.exports;
          } catch (fallbackError) {
            console.error('Could not load any component:', fallbackError);
            // Ultimate fallback - simple error component
            App = () => React.createElement('div', { 
              style: { 
                padding: '20px', 
                textAlign: 'center', 
                fontFamily: 'Arial, sans-serif' 
              } 
            }, 
              React.createElement('h1', null, 'NutriPlan'),
              React.createElement('p', null, 'Erro ao carregar a aplicação. Verifique se todos os arquivos estão disponíveis.')
            );
          }
        }

        // Render the application
        const root = createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
        
        console.log('NutriPlan carregado com sucesso!');
        
      } catch (error) {
        console.error('Erro fatal ao inicializar a aplicação:', error);
        
        // Emergency fallback
        document.getElementById('root').innerHTML = `
          <div style="padding: 20px; text-align: center; font-family: Arial, sans-serif;">
            <h1>NutriPlan</h1>
            <p style="color: red;">Erro ao carregar a aplicação.</p>
            <p>Por favor, verifique se todos os arquivos estão disponíveis e recarregue a página.</p>
          </div>
        `;
      }
    </script>
  </body>
</html>
